<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BIOGLOW Path Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* layout: full-height app, mat fills the left, moves + share code on the right */
:root{--red:#ED1C24;--ink:#1d1d1f;--line:#d9dde3;--panel:#f6f7f9;--bg:#fff;--blue:#0660AC;--green:#55AB35;
--sans:"Roboto",Arial,sans-serif;--mono:"Roboto Mono",Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}}
.stage{min-height:0;display:flex;align-items:center;justify-content:center}
.mapbox{position:relative;border:2px solid var(--ink);border-radius:4px;touch-action:none;user-select:none;aspect-ratio:var(--ar);max-width:100%;max-height:100%;width:100%}
@supports (width:min(1px,1px)){.mapbox{width:min(100%, calc((100vh - 28px) * var(--arn)))}}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
aside{min-height:0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:0}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.moves{flex:1;display:flex;flex-direction:column}
ol{margin:0;padding-left:22px;font-family:var(--mono);font-size:12.5px;line-height:1.75;overflow:auto;flex:1;min-height:0}
textarea{width:100%;font-family:var(--mono);font-size:10.5px;height:46px;border:1px solid var(--line);border-radius:4px;resize:none}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{background:#fff;border-radius:10px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.dlg label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.dlg input{width:90px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chips button{padding:4px 0;font-weight:700}
.chips button.sel{background:var(--red);color:#fff;border-color:var(--red)}
.lbl{font:700 12px var(--sans);fill:#fff;pointer-events:none}
</style>

 <aside>
  <div class="top"><button id="undo">Undo</button><button id="clear">Clear</button><button id="settings">Settings</button></div>
  <div class="card moves"><h2>Moves</h2><ol id="moves"></ol><div class="top" style="margin-top:8px"><button class="primary" id="copy">Copy moves</button></div></div>
  <div class="card"><h2>Share labels</h2><textarea id="share" aria-label="Label code"></textarea><div class="top" style="margin-top:6px"><button id="load">Load</button></div></div>
 </aside>
</div>
<div class="dlg" id="dlg" hidden><div class="box">
 <h2 style="margin:0;font-size:18px">Settings</h2>
 <label for="matw">Mat width (cm)<input id="matw" type="number" step="0.1" value="200.5"></label>
 <label for="math">Mat height (cm)<input id="math" type="number" step="0.1" value="114.3"></label>
 <label for="wheel">Wheel size (mm)<input id="wheel" type="number" step="1" value="56"></label>
 <div><b style="font-size:14px">Edit mission labels</b><div class="chips" id="chips" style="margin-top:6px"></div></div>
 <div><b style="font-size:14px">Dock spots (13–15)</b><div class="chips" id="dockchips" style="margin-top:6px"></div></div>
 <div class="top"><button class="primary" id="done">Done</button></div>
</div></div>
<script>
const NAMES={1:"Drone Survey",2:"Exploding Seeds",3:"Flip the Rock",4:"Lucky Leaves",5:"Reaching Roots",6:"Leafcutter Frenzy",7:"Humongous Fungus",8:"Tangled",9:"Research Platform",10:"Fragile Microhabitats",11:"Window to the Past",12:"Forest Elder",13:"Keystone Species",14:"Seeds of Renewal",15:"Biocentric Architecture"};
const AR=1.7541, VW=1000, VH=VW/AR;
document.documentElement.style.setProperty('--ar',AR);document.documentElement.style.setProperty('--arn',AR);
const $=id=>document.getElementById(id), svg=$('svg'); svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
let st={labels:{},docks:[null,null,null],assign:{13:0,14:1,15:2}};
try{const s=JSON.parse(localStorage.getItem('bioglowMap')||'null');if(s)st=Object.assign(st,s)}catch(e){}
let pts=[], selPt=-1, editLabel=null, editDock=null, drag=null;
function save(){try{localStorage.setItem('bioglowMap',JSON.stringify(st))}catch(e){}$('share').value=btoa(JSON.stringify(st))}
const cx=()=>(+$('matw').value||200.5)/VW, cy=()=>(+$('math').value||114.3)/VH;
function P(e){const r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*VW,(e.clientY-r.top)/r.height*VH]}
function labelPos(n){n=+n;if(n>=13){const d=st.docks[st.assign[n]];return d}return st.labels[n]}
// heading: degrees, 0 = facing far wall (up), clockwise positive
const hd=(dx,dy)=>(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
const norm=a=>{a=((a%360)+540)%360-180;return a};
function draw(){let s='';
 for(let n=1;n<=15;n++){const p=labelPos(n);if(!p)continue;const mv=n>=13;
  s+=`<g data-l="${n}" style="cursor:${mv?'grab':'default'}"><rect x="${p[0]-13}" y="${p[1]-10}" width="26" height="20" rx="4" fill="${mv?'#0660AC':'#55AB35'}" stroke="#fff" stroke-width="1.5"/><text class="lbl" x="${p[0]}" y="${p[1]+4.2}" text-anchor="middle">${n}</text><title>${n} ${NAMES[n]}</title></g>`}
 st.docks.forEach((d,i)=>{if(d&&editDock!==null)s+=`<circle cx="${d[0]}" cy="${d[1]}" r="18" fill="none" stroke="#0660AC" stroke-dasharray="3 3"/>`});
 if(pts.length>1)s+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#ED1C24" stroke-width="2"/>`;
 pts.forEach((p,i)=>{const a=p.h*Math.PI/180,L=22,tx=p.x+Math.sin(a)*L,ty=p.y-Math.cos(a)*L;const c=i?'#ED1C24':'#0660AC';
  s+=`<line x1="${p.x}" y1="${p.y}" x2="${tx}" y2="${ty}" stroke="${c}" stroke-width="2.5"/><polygon points="${tx+Math.sin(a)*6},${ty-Math.cos(a)*6} ${tx+Math.cos(a)*4},${ty+Math.sin(a)*4} ${tx-Math.cos(a)*4},${ty-Math.sin(a)*4}" fill="${c}"/>`;
  s+=`<circle data-p="${i}" cx="${p.x}" cy="${p.y}" r="${i===selPt?6:4.5}" fill="#fff" stroke="${c}" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="1.3" fill="${c}" pointer-events="none"/>`;
  if(i===selPt)s+=`<circle data-rot="${i}" cx="${tx+Math.sin(a)*10}" cy="${ty-Math.cos(a)*10}" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.5" style="cursor:grab"/>`;
  s+=`<text x="${p.x+7}" y="${p.y+14}" font-size="11" font-weight="700" fill="#1d1d1f" font-family="Roboto,Arial">${i}</text>`});
 svg.innerHTML=s;moves()}
function moves(){const out=[];if(!pts.length){$('moves').innerHTML='';return}
 const f=v=>v.toFixed(1), p0=pts[0];
 out.push(`Start ${f(p0.x*cx())} cm from left, ${f((VH-p0.y)*cy())} cm from bottom, facing ${Math.round(p0.h)}°`);
 let h=p0.h; const wd=(+$('wheel').value||56)/10*Math.PI;
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dxc=(b.x-a.x)*cx(),dyc=(b.y-a.y)*cy();const dist=Math.hypot(dxc,dyc);const dir=hd(dxc,dyc);
  let t=norm(dir-h),back=false;if(Math.abs(t)>90){t=norm(dir+180-h);back=true}
  if(Math.abs(t)>=1)out.push(`Turn ${t>0?'right':'left'} ${Math.round(Math.abs(t))}°`);
  out.push(`Drive ${back?'backward':'forward'} ${f(dist)} cm (${Math.round(dist/wd*360)}°)`);
  h=back?(dir+180)%360:dir;const t2=norm(b.h-h);if(Math.abs(t2)>=1){out.push(`Turn ${t2>0?'right':'left'} ${Math.round(Math.abs(t2))}°`);h=b.h}}
 $('moves').innerHTML=out.map(x=>`<li>${x}</li>`).join('')}
svg.addEventListener('pointerdown',e=>{const t=e.target,p=P(e);
 if(editLabel!==null){st.labels[editLabel]=p;editLabel=null;save();chips();draw();return}
 if(editDock!==null){st.docks[editDock]=p;editDock=null;save();chips();draw();return}
 if(t.dataset.rot!==undefined){drag={k:'rot',i:+t.dataset.rot};svg.setPointerCapture(e.pointerId);return}
 if(t.closest&&t.closest('[data-l]')){const n=+t.closest('[data-l]').dataset.l;if(n>=13){drag={k:'dock',n};svg.setPointerCapture(e.pointerId)}return}
 if(t.dataset.p!==undefined){selPt=+t.dataset.p;drag={k:'pt',i:selPt};svg.setPointerCapture(e.pointerId);draw();return}
 const prev=pts[pts.length-1];let h=0;if(prev){h=hd((p[0]-prev.x)*cx(),(p[1]-prev.y)*cy())}
 pts.push({x:p[0],y:p[1],h});selPt=pts.length-1;draw()});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=P(e);
 if(drag.k==='rot'){const q=pts[drag.i];q.h=Math.round(hd((p[0]-q.x)*cx(),(p[1]-q.y)*cy())/5)*5%360;draw()}
 else if(drag.k==='pt'){pts[drag.i].x=p[0];pts[drag.i].y=p[1];draw()}
 else if(drag.k==='dock'){drag.p=p}});
svg.addEventListener('pointerup',()=>{if(drag&&drag.k==='dock'&&drag.p){let best=-1,bd=1e9;st.docks.forEach((d,i)=>{if(!d)return;const dd=Math.hypot(d[0]-drag.p[0],d[1]-drag.p[1]);if(dd<bd){bd=dd;best=i}});
 if(best>=0){const other=Object.keys(st.assign).find(k=>st.assign[k]===best);if(other)st.assign[other]=st.assign[drag.n];st.assign[drag.n]=best;save();draw()}}drag=null});
function chips(){const c=$('chips');c.innerHTML='';for(let n=1;n<=12;n++){const b=document.createElement('button');b.textContent=n;b.title=NAMES[n];if(editLabel===n)b.className='sel';b.onclick=()=>{editLabel=n;editDock=null;$('dlg').hidden=true;chips()};c.appendChild(b)}
 const d=$('dockchips');d.innerHTML='';['Dock A','Dock B','Dock C'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{editDock=i;editLabel=null;$('dlg').hidden=true;draw()};d.appendChild(b)});d.style.gridTemplateColumns='repeat(3,1fr)'}
$('undo').onclick=()=>{pts.pop();selPt=pts.length-1;draw()};$('clear').onclick=()=>{pts=[];selPt=-1;draw()};
$('settings').onclick=()=>{$('dlg').hidden=false};$('done').onclick=()=>{$('dlg').hidden=true;draw()};
['matw','math','wheel'].forEach(id=>$(id).oninput=moves);
$('copy').onclick=()=>{const t=[...document.querySelectorAll('#moves li')].map((l,i)=>`${i+1}. ${l.textContent}`).join('\n');navigator.clipboard.writeText(t).then(()=>{$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy moves',1200)},()=>{})};
$('load').onclick=()=>{try{st=JSON.parse(atob($('share').value.trim()));save();draw()}catch(e){$('share').value=''}};
document.addEventListener('keydown',e=>{if(selPt<0)return;if(e.key==='['||e.key===']'){pts[selPt].h=(pts[selPt].h+(e.key===']'?5:355))%360;draw()}});
save();chips();draw();
</script>

</body></html>
